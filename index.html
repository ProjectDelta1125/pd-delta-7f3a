<style>
:root {
  --olive: #3A5F3A;
  --rust: #9C5F4A;
  --terracotta: #A57A5A;
  --charcoal: #1F2A2F;
  --white: #FFFFFF;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, sans-serif; color: var(--charcoal); background: #f4f1ec; }
header { background: var(--olive); color: var(--white); padding: 12px 16px; font-weight: 600; letter-spacing: 0.02em; display: flex; align-items: center; justify-content: space-between; }
header .role { font-size: 12px; font-weight: 500; opacity: 0.9; }
.nav { display: flex; gap: 8px; padding: 8px 14px; background: #fff; border-bottom: 1px solid #ddd; }
.nav button { min-height: 44px; padding: 8px 16px; border: 1px solid var(--olive); background: #fff; color: var(--olive); border-radius: 4px; font-weight: 600; }
.nav button.active { background: var(--olive); color: var(--white); }
.counts { display: flex; flex-wrap: wrap; gap: 10px 16px; padding: 8px 14px; background: #fff; border-bottom: 1px solid #ddd; font-size: 13px; color: var(--charcoal); }
.counts span { white-space: nowrap; }
.counts strong { color: var(--olive); font-weight: 700; }
.layout { position: relative; }
.stage { position: relative; width: 100%; max-width: 1100px; margin: 0 auto; }
.stage img { width: 100%; height: auto; display: block; }
.btn { position: absolute; min-height: clamp(16px, 3.2vw, 28px); min-width: clamp(16px, 3.2vw, 28px); padding: clamp(2px, 0.5vw, 6px) clamp(4px, 1vw, 10px); background: rgba(156, 95, 74, 0.75); color: var(--white); border: 1px solid #fff; border-radius: clamp(6px, 1vw, 10px); font-weight: 700; font-size: clamp(7px, 1.6vw, 11px); letter-spacing: 0.02em; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.3); line-height: 1; display: flex; align-items: center; justify-content: center; text-align: center; white-space: nowrap; }
.btn.inactive { opacity: 0.45; cursor: default; pointer-events: none; }
.btn:focus { outline: 3px solid var(--olive); }
.btn.active { outline: 3px solid #fff; }
.panel { position: fixed; top: 0; right: 0; width: 380px; max-width: 100%; height: 100%; background: #fff; box-shadow: -4px 0 16px rgba(0,0,0,0.15); transform: translateX(100%); transition: transform 0.25s ease; z-index: 20; display: flex; flex-direction: column; }
.panel.open { transform: translateX(0); }
.panel-head { background: var(--olive); color: var(--white); padding: 10px 12px; display: flex; align-items: center; gap: 8px; }
.panel-head button { min-height: 44px; min-width: 44px; background: var(--rust); color: var(--white); border: none; border-radius: 4px; font-size: 20px; font-weight: 700; }
.panel-head h2 { margin: 0; flex: 1; font-size: 18px; }
.panel-body { overflow: auto; padding: 12px; flex: 1; }
.panel-body h3 { margin: 14px 0 6px; color: var(--olive); border-bottom: 1px solid #ddd; padding: 8px 0 4px; position: sticky; top: 0; background: #fff; z-index: 2; }
.panel-body table { width: 100%; border-collapse: collapse; font-size: 14px; }
.panel-body td { padding: 6px 4px; border-bottom: 1px solid #eee; vertical-align: top; }
.panel-body a { color: #0d4a8c; text-decoration: none; }
.panel-body a:hover, .panel-body a:focus { text-decoration: none; color: #082f5c; }
.counts a { color: #0d4a8c; text-decoration: none; cursor: pointer; }
.counts a:hover, .counts a:focus { text-decoration: none; color: #082f5c; }
.pending { color: #888; font-style: italic; }
.pending-tag { font-size: 11px; color: var(--terracotta); margin-left: 6px; }
.qty { font-weight: 700; color: var(--olive); width: 36px; }
.size { color: #666; font-size: 12px; white-space: nowrap; }
.note { font-size: 12px; color: #666; margin-top: 12px; }
.search-view { display: none; padding: 14px; max-width: 720px; margin: 0 auto; }
.search-view input, .search-view select { width: 100%; min-height: 44px; margin-bottom: 8px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
.search-row { display: flex; gap: 8px; margin-bottom: 8px; }

.search-group th { text-align: left; font-size: 12px; color: #666; font-weight: 600; padding: 4px; border-bottom: 1px solid #ddd; }
.search-group td { padding: 6px 4px; border-bottom: 1px solid #eee; vertical-align: top; word-break: break-word; overflow-wrap: anywhere; }
.search-group th:nth-child(1), .search-group td:nth-child(1) { width: 40px; padding-right: 2px; }
.search-group th:nth-child(2), .search-group td:nth-child(2) { width: 36%; padding-left: 2px; }
.search-group th:nth-child(3), .search-group td:nth-child(3) { width: 30%; }
.search-group th:nth-child(4), .search-group td:nth-child(4) { width: 28%; }
.search-group .garden-text {

#app { display: none; }
#gate {

.gate-box {

.gate-box p { margin: 0 0 18px; font-size: 14px; color: #666; }
.gate-box input {

.gate-box button {

}
.gate-box .msg { margin-top: 12px; font-size: 13px; color: var(--rust); min-height: 18px; }
.logout { background: none; border: none; color: var(--white); font-size: 12px; text-decoration: none; cursor: pointer; padding: 0; }
.toc-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }

.toc-table a { color: #0d4a8c; text-decoration: none; font-weight: 600; }

.toc-table .rev, .toc-table .date { font-size: 11px; color: #555; white-space: nowrap; }

.plant-name-cell { display: flex; align-items: center; }
.plant-name-cell a { flex: 1; }

</style>

const CODES = { '2029': 'user', '1125': 'admin' };
const AUTH_KEY = 'pd_auth';
const memStore = {};

function storeGet(key) {
  try { return sessionStorage.getItem(key); } catch (e) { return memStore[key] || null; }
}
function storeSet(key, value) {
  try { sessionStorage.setItem(key, value); } catch (e) { memStore[key] = value; }
}
function storeRemove(key) {
  try { sessionStorage.removeItem(key); } catch (e) { delete memStore[key]; }
}

function checkCode(e) {
  e.preventDefault();
  const code = document.getElementById('code').value.trim().toLowerCase();
  const role = CODES[code];
  if (!role) {
    document.getElementById('gateMsg').textContent = 'Incorrect passcode.';
    document.getElementById('code').value = '';
    return false;
  }
  storeSet(AUTH_KEY, role);
  openApp(role);
  return false;
}

function openApp(role) {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('roleLabel').textContent = role === 'admin' ? 'Admin' : 'Field';
  if (!DATA) load().catch(err => {
    document.getElementById('versionFooter').textContent = 'Data file not loaded. Place plant-data.json next to this page.';
    console.error(err);
  });
}

function logout() {
  storeRemove(AUTH_KEY);
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('code').value = '';
  document.getElementById('gateMsg').textContent = '';
  document.getElementById('panel').classList.remove('open');
}

function setPlantActionsVisible(show) {
  const ps = document.getElementById('printSelect');
  const ds = document.getElementById('downloadSelect');
  if (ps) ps.style.display = show ? '' : 'none';
  if (ds) ds.style.display = show ? '' : 'none';
}

function openTOC() {
  currentGarden = "__TOC__";
  setPlantActionsVisible(false);
  document.getElementById("title").textContent = "Drawing TOC";
  document.getElementById("panel").classList.add("open");
  document.querySelectorAll(".btn").forEach(b => b.classList.remove("active"));
  const content = document.getElementById("content");
  let html = '<table class="toc-table"><thead><tr><th>Sheet</th><th>Title</th><th>Rev</th><th>Date</th></tr></thead><tbody>';
  const sortedTOC = [...DRAWING_TOC].sort((a, b) => {
    const pa = a.sheet.replace(/([0-9]+)/g, m => m.padStart(4, '0'));
    const pb = b.sheet.replace(/([0-9]+)/g, m => m.padStart(4, '0'));
    return pa.localeCompare(pb);
  });
  sortedTOC.forEach(s => {
    if (s.loaded) {
      html += `<tr><td class="loaded-cell"><a href="#" onclick="openPlan('${s.detail}','${s.sheet} ${s.title}','${s.rev}','${s.date}',null,0); return false;">${s.sheet}</a></td><td class="loaded-cell"><a href="#" onclick="openPlan('${s.detail}','${s.sheet} ${s.title}','${s.rev}','${s.date}',null,0); return false;">${s.title}</a></td><td class="rev">${s.rev}</td><td class="date">${s.date}</td></tr>`;
    } else {
      html += `<tr><td>${s.sheet}</td><td>${s.title}</td><td class="rev">${s.rev}</td><td class="date">${s.date}</td></tr>`;
    }
  });
  html += '</tbody></table>';
  content.innerHTML = html;
}

  if (sheet) {

      <div style="width:100%; max-width:280px; background:#f4f4f4; border-radius:6px; border:1.1px solid #b0b0b0; overflow:hidden;">

async function load() {
  const res = await fetch(DATA_FILE);
  DATA = await res.json();
  try {
    const s = await fetch(STATUS_FILE);
    const status = await s.json();
    if (Array.isArray(status.present)) {
      PRESENT = new Set(status.present);
    } else if (status && typeof status === 'object') {
      // Flat { id: true/false } shape — keep only true entries
      PRESENT = new Set(Object.keys(status).filter(k => status[k] === true));
    } else {
      PRESENT = new Set();
    }
  } catch (e) {
    PRESENT = new Set();
  }
  const ver = DATA.version || DATA_VERSION;
  const pdfCount = PRESENT.size;
  document.getElementById('versionFooter').textContent = 'Data: ' + ver + ' | PDFs present: ' + pdfCount + ' | Missing sheets show “sheet pending” | Full botanical and common names';
  renderCounts();
  const gf = document.getElementById('gardenFilter');
  [...gardenOrder].sort().forEach(g => { const o = document.createElement('option'); o.value = g; o.textContent = g; gf.appendChild(o); });
  const typeOrder = ['Tree', 'Shrub', 'Groundcover', 'Vine', 'Bulb', 'Planter'];
  const typeLabels = { Tree: 'Trees', Shrub: 'Shrubs', Groundcover: 'Groundcovers', Vine: 'Vines', Bulb: 'Bulbs', Planter: 'Planters' };
  const presentTypes = new Set(Object.values(DATA.plants).map(p => p.type));
  const tf = document.getElementById('typeFilter');
  typeOrder.forEach(t => {
    if (presentTypes.has(t)) {
      const o = document.createElement('option');
      o.value = t;
      o.textContent = typeLabels[t] || t;
      tf.appendChild(o);
    }
  });
}

function renderCounts() {
  if (!DATA || !DATA.plants) return;
  const counts = {};
  let totalQty = 0;
  Object.values(DATA.plants).forEach(p => {
    if (p.skip) return;
    const t = p.type || 'Other';
    counts[t] = (counts[t] || 0) + 1;
    if (p.gardens) {
      Object.values(p.gardens).forEach(rows => {
        if (Array.isArray(rows)) {
          rows.forEach(r => {
            if (String(r.size || '').trim().toUpperCase() === 'SF') return;
            totalQty += Number(r.qty) || 0;
          });
        }
      });
    }
  });
  const order = ['Tree', 'Shrub', 'Groundcover', 'Planter', 'Bulb', 'Vine'];
  const parts = order.filter(t => counts[t]).map(t => {
    const label = t === 'Tree' ? 'Trees' : t === 'Shrub' ? 'Shrubs' : t === 'Groundcover' ? 'Groundcovers' : t === 'Planter' ? 'Planters' : t === 'Bulb' ? 'Bulbs' : t === 'Vine' ? 'Vines' : t;
    return `<span><a href="#" onclick="filterByType('${t}'); return false;"><strong>${counts[t]}</strong> ${label}</a></span>`;
  });
  const unique = Object.values(counts).reduce((s, n) => s + n, 0);
  const totalStr = Math.round(totalQty).toLocaleString();
  document.getElementById('countsStrip').innerHTML = parts.join('') + `<span style="margin-left:auto;"><strong>${unique}</strong> unique plants · <strong>${totalStr}</strong> total plants</span>`;
}

function filterByType(type) {
  showSearch();
  document.getElementById('typeFilter').value = type;
  document.getElementById('q').value = '';
  document.getElementById('gardenFilter').value = '';
  runSearch();
}

function openPanel(garden) {
  currentGarden = garden;
  setPlantActionsVisible(true);
  document.getElementById('title').textContent = garden;
  document.getElementById('panel').classList.add('open');
  document.querySelectorAll('.btn').forEach(b => b.classList.toggle('active', b.dataset.garden === garden));
  const content = document.getElementById('content');
  const g = DATA && DATA.gardens && DATA.gardens[garden];
  if (!g) { content.innerHTML = '<p>No plant list for this garden in the data file.</p>'; return; }
  let html = '';
  const plans = (GARDEN_PLANS[garden] || []).concat(SITE_SCHEDULES);
  plans.sort((a, b) => {
    const extract = (label) => {
      const m = label.match(/L(\d+(?:\.\d+)*(?:\.[A-Z])?)/i);
      return m ? m[1] : label;
    };
    return extract(a.label).localeCompare(extract(b.label), undefined, { numeric: true });
  });
  if (plans && plans.length) {
    html += '<div class="plans-bar" style="margin:0 0 12px; padding:8px; background:#f7f5f2; border-radius:6px;">';
    html += '<div style="font-size:13px; font-weight:600; color:var(--olive); margin-bottom:6px;">Plans</div>';
    plans.forEach((p, i) => {
      const rev = p.rev ? `Rev ${p.rev}` : '';
      const date = p.date || '';
      const safeLabel = (p.label || '').replace(/'/g, "\\'");
      html += `<button type="button" onclick="openPlan('${p.detail}','${safeLabel}','${rev}','${date}', window._currentPlans, ${i})" style="display:flex; width:100%; margin:4px 0; min-height:44px; align-items:center; padding:8px 10px; background:var(--rust); color:#fff; border:none; border-radius:4px; font-weight:600; font-size:14px; text-align:left;">
        <span style="flex:1;">${p.label}</span>
        <span style="font-weight:400; font-size:10px; opacity:0.85; text-align:right; line-height:1.15; letter-spacing:0.01em;">${rev}<br>${date}</span>
      </button>`;
    });
    window._currentPlans = plans;
    html += '</div>';
  }
  const sectionOrder = ['Trees', 'Shrubs', 'Groundcovers', 'Planters', 'Bulbs', 'Vines', 'Other'];
  const ordered = [...sectionOrder.filter(s => g[s]), ...Object.keys(g).filter(s => !sectionOrder.includes(s))];
  for (const section of ordered) {
    const rows = g[section];
    const merged = {};
    rows.forEach(r => {
      const id = r.id;
      if (!merged[id]) merged[id] = { qty: 0, sizes: [], plantQty: 0 };
      merged[id].qty += (parseInt(r.qty, 10) || 0);
      if (String(r.size || '').trim().toUpperCase() !== 'SF') {
        merged[id].plantQty += (parseInt(r.qty, 10) || 0);
      }
      if (r.size && !merged[id].sizes.includes(r.size)) merged[id].sizes.push(r.size);
    });
    const total = Object.values(merged).reduce((s, m) => s + (m.plantQty || 0), 0);
    html += `<h3>${section} <span style="font-weight:400;color:#666;">(${total})</span></h3><table>`;
    const sorted = Object.entries(merged).sort((a, b) => {
      const pa = DATA.plants[a[0]] || {};
      const pb = DATA.plants[b[0]] || {};
      const na = (pa.display || pa.name || a[0]).toLowerCase();
      const nb = (pb.display || pb.name || b[0]).toLowerCase();
      return na.localeCompare(nb);
    });
    for (const [id, m] of sorted) {
      const plant = DATA.plants[id] || {};
      const sizeStr = m.sizes.join(', ');
      const hay = ((plant.botanical || '') + ' ' + (plant.common || '') + ' ' + (plant.display || '') + ' ' + (plant.name || '')).toLowerCase().replace(/"/g, '');
    html += `<tr data-plant="${hay}"><td class="qty">${m.qty}</td><td>${nameCell(id, plant)}</td><td class="size">${sizeStr}</td></tr>`;
    }
    html += '</table>';
  }
  html += '<p class="note">Click a plant name to open its ID sheet. Full botanical and common names, including cultivar and variety. Sheets not yet dropped show “sheet pending.” Plan buttons open the matching sheet. Pinch to zoom, drag to pan.</p>';
  content.innerHTML = html;
}

      applyTransform();
    }, { passive: false });

    scroll.addEventListener('pointerdown', e => {
      if (e.pointerType === 'touch' && scroll.setPointerCapture) return;
      drag = { x: e.clientX - planPanX, y: e.clientY - planPanY };
      scroll.style.cursor = 'grabbing';
    });
    window.addEventListener('pointermove', e => {
      if (!drag) return;
      planPanX = e.clientX - drag.x;
      planPanY = e.clientY - drag.y;
      applyTransform();
    });
    window.addEventListener('pointerup', () => { drag = null; scroll.style.cursor = 'grab'; });

    scroll.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        pinch = { dist: Math.hypot(dx, dy), scale: planScale };
      } else if (e.touches.length === 1) {
        drag = { x: e.touches[0].clientX - planPanX, y: e.touches[0].clientY - planPanY };
      }
    }, { passive: true });
    scroll.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && pinch) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        const ratio = dist / pinch.dist; const damped = 1 + (ratio - 1) * 0.35; planScale = Math.max(planFit * 0.5, Math.min(Math.max(planFit * 8, 1.5), pinch.scale * damped));
        applyTransform();
      } else if (e.touches.length === 1 && drag) {
        planPanX = e.touches[0].clientX - drag.x;
        planPanY = e.touches[0].clientY - drag.y;
        applyTransform();
      }
    }, { passive: false });
    scroll.addEventListener('touchend', () => { drag = null; pinch = null; });
  }

  const p = currentPlanList[currentPlanIndex];
  const img = overlay.querySelector('#planImg');
  const scroll = overlay.querySelector('#planScroll');

  function computeFit() {
    if (!img.naturalWidth || !img.naturalHeight) return 1;
    const pad = 16;
    const w = Math.max(1, scroll.clientWidth - pad);
    const h = Math.max(1, scroll.clientHeight - pad);
    return Math.min(w / img.naturalWidth, h / img.naturalHeight);
  }
  function applyFit() {
    planFit = computeFit();
    planScale = planFit;
    planPanX = 0;
    planPanY = 0;
    img.style.transform = `translate(-50%, -50%) scale(${planScale})`;
  }
  img.onload = applyFit;
  if (img.complete && img.naturalWidth) applyFit();
  img.src = p.detail || src;
  overlay.querySelector('#planTitle').innerHTML = formatPlanTitle(p.label || label);
  let r = (p.rev || rev || '').toString().trim();
  if (r && !/^rev\s/i.test(r)) r = 'Rev ' + r;
  const d = p.date || date || '';
  overlay.querySelector('#planRev').innerHTML = r + (d ? '<br>' + d : '');
  overlay.style.display = 'flex';
  const showArrows = currentPlanList.length > 1;
  const prevBtn = overlay.querySelector('#planPrev');
  const nextBtn = overlay.querySelector('#planNext');
  if (prevBtn) prevBtn.style.display = showArrows ? '' : 'none';
  if (nextBtn) nextBtn.style.display = showArrows ? '' : 'none';

  if (!overlay._resizeBound) {
    overlay._resizeBound = true;
    window.addEventListener('resize', () => {
      if (overlay.style.display !== 'none' && img.naturalWidth) applyFit();
    });
  }
}

function matchesQuery(p, q) {
  if (!q) return true;
  const fields = [p.display, p.name, p.botanical, p.common].filter(Boolean).map(s => s.toLowerCase());
  return fields.some(f => f.includes(q));
}

function clearSearch() {
  document.getElementById('q').value = '';
  document.getElementById('gardenFilter').value = '';
  document.getElementById('typeFilter').value = '';
  runSearch();
  document.getElementById('q').focus();
}

function plantLink(id, plant, text) {
  const label = text || plant.botanical || plant.display || plant.name || id;
  if (hasSheet(id)) {
    const pub = plant.published ? `<span class="pub-date">${plant.published}</span>` : '';
    return `<a href="#" onclick="openPlantDetail('${id}'); return false;" style="color:inherit; text-decoration:underline;">${label}</a>${pub}`;
  }
  return `<span class="pending">${label}</span><span class="pending-tag">sheet pending</span>`;
}

function runSearch() {
  if (!DATA) return;
  const q = document.getElementById('q').value.trim().toLowerCase();
  const g = document.getElementById('gardenFilter').value;
  const t = document.getElementById('typeFilter').value;
  const box = document.getElementById('searchResults');
  const hits = [];
  for (const p of Object.values(DATA.plants)) {
    if (p.skip) continue;
    if (t && p.type !== t) continue;
    if (!matchesQuery(p, q)) continue;
    const gardens = Object.keys(p.gardens || {});
    if (g && !gardens.includes(g)) continue;
    hits.push(p);
  }
  if (!hits.length) {
    box.innerHTML = '<p class="empty-state">No plants match.</p>';
    return;
  }
  hits.sort((a, b) => (a.botanical || a.display || a.name || '').toLowerCase().localeCompare((b.botanical || b.display || b.name || '').toLowerCase()));
  const typeToSection = { 'Tree': 'Trees', 'Shrub': 'Shrubs', 'Groundcover': 'Groundcovers', 'Planter': 'Planters', 'Bulb': 'Bulbs', 'Vine': 'Vines' };
  const sectionOrder = ['Trees', 'Shrubs', 'Planters', 'Groundcovers', 'Bulbs', 'Vines'];
  const groups = {};
  hits.forEach(p => {
    const sec = typeToSection[p.type] || 'Other';
    if (!groups[sec]) groups[sec] = [];
    groups[sec].push(p);
  });
  const ordered = [...sectionOrder.filter(s => groups[s]), ...Object.keys(groups).filter(s => !sectionOrder.includes(s))];
  let html = `<p class="match-count">${hits.length} match${hits.length === 1 ? '' : 'es'}</p>`;
  const gFilter = document.getElementById('gardenFilter').value;
  for (const sec of ordered) {
    const rows = groups[sec];
    let sectionQty = 0;
    rows.forEach(p => {
      const gardensToSum = gFilter ? [gFilter] : Object.keys(p.gardens || {});
      gardensToSum.forEach(gn => {
        (p.gardens[gn] || []).forEach(r => { sectionQty += isSf(r) ? 0 : (parseInt(r.qty, 10) || 0); });
      });
    });
    html += `<div class="search-group"><h3>${sec} <span style="font-weight:400;color:#666;">(${sectionQty})</span></h3><table><thead><tr><th class="qty">Qty</th><th>Botanical</th><th>Common</th><th>Garden</th></tr></thead><tbody>`;
    rows.forEach(p => {
      let totalQty = 0;
      const gardenNames = Object.keys(p.gardens || {});
      const qtyGardens = gFilter ? [gFilter] : gardenNames;
      qtyGardens.forEach(gn => {
        (p.gardens[gn] || []).forEach(r => { totalQty += (parseInt(r.qty, 10) || 0); });
      });
      const common = p.common || '';
      const asbuilt = (p.photos && p.photos.asbuilt) || {};
      const asbuiltGardens = Object.keys(asbuilt).filter(gn => Array.isArray(asbuilt[gn]) && asbuilt[gn].length);
      const relevantAsbuilt = gFilter ? asbuiltGardens.filter(gn => gn === gFilter) : asbuiltGardens;
      const asbuiltNote = relevantAsbuilt.length ? ` <span style="color:var(--olive); font-size:12px;">As-built: ${relevantAsbuilt.join(', ')}</span>` : '';
      const gardenHtml = gardenNames.map(gn => `<span>${gn}</span>`).join('');
      html += `<tr><td class="qty">${totalQty}</td><td>${plantLink(p.id, p, p.botanical)}</td><td>${plantLink(p.id, p, p.common || '')}</td><td class="garden-col"><span class="garden-text" title="${gardenNames.join(', ')}">${gardenHtml}</span>${asbuiltNote}</td></tr>`;
    });
    html += '</tbody></table></div>';
  }
  box.innerHTML = html;
}

function printPlant(id) {

async function handleDownload(value) {
  if (!value) return;
  document.getElementById('downloadSelect').value = '';
  await downloadGardenZips(value === 'all' ? null : value);
}

async function downloadGardenZips(onlySection) {
  if (!currentGarden || !DATA) { alert('Open a garden first'); return; }
  const g = DATA.gardens && DATA.gardens[currentGarden];
  if (!g) { alert('No plants for this garden'); return; }
  const sectionOrder = ["Trees","Shrubs","Vines","Groundcovers","Bulbs","Planters"];
  const sections = onlySection
    ? [[onlySection, g[onlySection] || []]]
    : sectionOrder.filter(s => g[s] && g[s].length).map(s => [s, g[s]])
      .concat(Object.keys(g).filter(s => !sectionOrder.includes(s) && g[s] && g[s].length).map(s => [s, g[s]]));
  const ids = new Set();
  for (const [section, rows] of sections) {
    if (!rows) continue;
    for (const r of rows) {
      if (r.id && hasSheet(r.id)) ids.add(r.id);
    }
  }
  if (!ids.size) { alert('No plant ID sheets available for this selection'); return; }
  if (typeof JSZip === 'undefined') { alert('Zip library not loaded. Check connection and try again.'); return; }
  const zip = new JSZip();
  const date = new Date().toISOString().slice(0, 10);
  const label = onlySection || 'All';
  const safeGarden = currentGarden.replace(/[^A-Za-z0-9]+/g, '_');
  const safeLabel = label.replace(/[^A-Za-z0-9]+/g, '_');
  let added = 0;
  const status = document.createElement('div');
  status.style.cssText = 'position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#3A5F3A;color:#fff;padding:8px 14px;border-radius:4px;z-index:50;font-size:14px;';
  status.textContent = 'Preparing ' + ids.size + ' sheets…';
  document.body.appendChild(status);
  try {
    for (const id of [...ids].sort()) {
      const url = pdfHref(id);
      const res = await fetch(url);
      if (!res.ok) continue;
      const blob = await res.blob();
      if (!blob || !blob.size) continue;
      const plant = DATA.plants[id] || {};
      const slug = (plant.botanical || plant.display || id).replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 60);
      zip.file(id + '_' + slug + '.pdf', blob);
      added += 1;
      status.textContent = 'Added ' + added + ' of ' + ids.size + '…';
    }
    if (!added) { alert('No sheets could be fetched'); return; }
    status.textContent = 'Building zip…';
    const content = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(content);
    a.download = safeGarden + '_' + safeLabel + '_' + date + '.zip';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  } catch (err) {
    alert('Could not build zip: ' + (err.message || err));
  } finally {
    status.remove();
  }
}

function handlePrint(value) {
  if (!value) return;
  document.getElementById('printSelect').value = '';
  if (value === 'all') printGarden();
  else printGarden(value);
}

function printGarden(onlySection) {
  if (!currentGarden || !DATA) return;
  const g = DATA.gardens && DATA.gardens[currentGarden];
  if (!g) return;
  let body = `<h1>${currentGarden}${onlySection ? ' — ' + onlySection : ''}</h1>`;
  const sectionOrder = ["Trees","Shrubs","Vines","Groundcovers","Bulbs","Planters"];
  const sections = onlySection
    ? [[onlySection, g[onlySection] || []]]
    : sectionOrder.filter(s => g[s] && g[s].length).map(s => [s, g[s]])
      .concat(Object.keys(g).filter(s => !sectionOrder.includes(s) && g[s] && g[s].length).map(s => [s, g[s]]));
  for (const [section, rows] of sections) {
    if (!rows || !rows.length) continue;
    const merged = {};
    rows.forEach(r => {
      const id = r.id;
      if (!merged[id]) merged[id] = { qty: 0, sizes: [] };
      merged[id].qty += (parseInt(r.qty, 10) || 0);
      if (r.size && !merged[id].sizes.includes(r.size)) merged[id].sizes.push(r.size);
    });
    body += `<h2>${section}</h2><table><thead><tr><th>Qty</th><th>Plant</th><th>Size</th></tr></thead><tbody>`;
    const sorted = Object.entries(merged).sort((a, b) => {
      const pa = DATA.plants[a[0]] || {};
      const pb = DATA.plants[b[0]] || {};
      return ((pa.display || pa.name || a[0]).toLowerCase()).localeCompare((pb.display || pb.name || b[0]).toLowerCase());
    });
    for (const [id, m] of sorted) {
      const plant = DATA.plants[id] || {};
      const name = plant.display || plant.name || id;
      const sizeStr = m.sizes.join(', ');
      body += `<tr><td>${m.qty}</td><td>${name}</td><td>${sizeStr}</td></tr>`;
    }
    body += '</tbody></table>';
  }
  openPrintView(currentGarden + (onlySection ? ' — ' + onlySection : ''), body);
}

function sumQty(entries) {
  if (!Array.isArray(entries)) return 0;
  return entries.reduce((n, e) => n + (Number(e.qty) || 0), 0);
}
function isSf(r) {
  return String((r && r.size) || '').trim().toUpperCase() === 'SF';
}
function sumPlantQty(entries) {
  if (!Array.isArray(entries)) return 0;
  return entries.reduce((n, e) => n + (isSf(e) ? 0 : (Number(e.qty) || 0)), 0);
}
function plantTotalQty(plant) {
  return Object.values(plant.gardens || {}).reduce((n, entries) => n + sumQty(entries), 0);
}
function plantCountQty(plant) {
  return Object.values(plant.gardens || {}).reduce((n, entries) => n + sumPlantQty(entries), 0);
}

function printSearch() {
  if (!DATA) return;
  const q = document.getElementById('q').value.trim().toLowerCase();
  const g = document.getElementById('gardenFilter').value;
  const t = document.getElementById('typeFilter').value;
  const hits = [];
  for (const plant of Object.values(DATA.plants)) {
    if (plant.skip) continue;
    if (t && plant.type !== t) continue;
    if (!matchesQuery(plant, q)) continue;
    const gardens = Object.keys(plant.gardens || {});
    if (g && !gardens.includes(g)) continue;
    hits.push(plant);
  }
  const typeOrder = ['Tree', 'Shrub', 'Vine', 'Groundcover', 'Bulb', 'Planter'];
  const groups = {};
  hits.forEach(plant => {
    const ty = plant.type || 'Other';
    if (!groups[ty]) groups[ty] = [];
    groups[ty].push(plant);
  });
  Object.values(groups).forEach(list => {
    list.sort((a, b) => (a.botanical || a.display || a.name || '').toLowerCase().localeCompare((b.botanical || b.display || b.name || '').toLowerCase()));
  });
  const gardenLabel = g || 'All gardens';
  const typeLabel = t || 'All types';
  const speciesCount = hits.length;
  let totalPlants = 0;
  hits.forEach(plant => {
    totalPlants += g ? sumPlantQty(plant.gardens[g]) : plantCountQty(plant);
  });
  let body = `<p class="print-small">Search results</p>`;
  body += `<h1 class="print-xlarge">${gardenLabel}</h1>`;
  body += `<h1 class="print-large">${typeLabel}</h1>`;
  body += `<h1 class="print-large"># species: ${speciesCount}</h1>`;
  body += `<h1 class="print-large"># plants: ${totalPlants}</h1>`;
  if (q) body += `<p>Search: ${document.getElementById('q').value.trim()}</p>`;
  const orderedTypes = typeOrder.filter(ty => groups[ty]).concat(Object.keys(groups).filter(ty => !typeOrder.includes(ty)));
  orderedTypes.forEach(ty => {
    const list = groups[ty];
    let sectionQty = 0;
    list.forEach(plant => { sectionQty += g ? sumPlantQty(plant.gardens[g]) : plantCountQty(plant); });
    body += `<h2 class="section-head">${ty}s &nbsp;&nbsp; # species: ${list.length} &nbsp;&nbsp; # plants: ${sectionQty}</h2>`;
    if (g) {
      body += '<table><thead><tr><th>Qty</th><th>Botanical</th><th>Common</th></tr></thead><tbody>';
      list.forEach(plant => {
        const qty = sumQty(plant.gardens[g]);
        body += `<tr><td>${qty}</td><td>${plant.botanical || ''}</td><td>${plant.common || ''}</td></tr>`;
      });
    } else {
      body += '<table><thead><tr><th>Qty</th><th>Botanical</th><th>Common</th><th>Gardens</th></tr></thead><tbody>';
      list.forEach(plant => {
        const qty = plantTotalQty(plant);
        const gardens = Object.keys(plant.gardens || {}).join(', ');
        body += `<tr><td>${qty}</td><td>${plant.botanical || ''}</td><td>${plant.common || ''}</td><td>${gardens}</td></tr>`;
      });
    }
    body += '</tbody></table>';
  });
  openPrintView('Search results', body);
}
