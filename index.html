<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Project Delta</title>
<style>
:root {
  --olive: #3A5F3A;
  --rust: #9C5F4A;
  --terracotta: #A57A5A;
  --charcoal: #1F2A2F;
  --white: #FFFFFF;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, sans-serif; color: var(--charcoal); background: #f4f1ec; }
header { background: var(--olive); color: var(--white); padding: 12px 16px; font-weight: 600; letter-spacing: 0.02em; display: flex; align-items: center; justify-content: space-between; }
header .role { font-size: 12px; font-weight: 500; opacity: 0.9; }
.nav { display: flex; gap: 8px; padding: 8px 14px; background: #fff; border-bottom: 1px solid #ddd; }
.nav button { min-height: 44px; padding: 8px 16px; border: 1px solid var(--olive); background: #fff; color: var(--olive); border-radius: 4px; font-weight: 600; }
.nav button.active { background: var(--olive); color: var(--white); }
.counts { display: flex; flex-wrap: wrap; gap: 10px 16px; padding: 8px 14px; background: #fff; border-bottom: 1px solid #ddd; font-size: 13px; color: var(--charcoal); }
.counts span { white-space: nowrap; }
.counts strong { color: var(--olive); font-weight: 700; }
.layout { position: relative; }
.stage { position: relative; width: 100%; max-width: 1100px; margin: 0 auto; }
.stage img { width: 100%; height: auto; display: block; }
.btn { position: absolute; min-height: clamp(16px, 3.2vw, 28px); min-width: clamp(16px, 3.2vw, 28px); padding: clamp(2px, 0.5vw, 6px) clamp(4px, 1vw, 10px); background: rgba(156, 95, 74, 0.75); color: var(--white); border: 1px solid #fff; border-radius: clamp(6px, 1vw, 10px); font-weight: 700; font-size: clamp(7px, 1.6vw, 11px); letter-spacing: 0.02em; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.3); line-height: 1; display: flex; align-items: center; justify-content: center; text-align: center; white-space: nowrap; }
.btn.inactive { opacity: 0.45; cursor: default; pointer-events: none; }
.btn:focus { outline: 3px solid var(--olive); }
.btn.active { outline: 3px solid #fff; }
.panel { position: fixed; top: 0; right: 0; width: 380px; max-width: 100%; height: 100%; background: #fff; box-shadow: -4px 0 16px rgba(0,0,0,0.15); transform: translateX(100%); transition: transform 0.25s ease; z-index: 20; display: flex; flex-direction: column; }
.panel.open { transform: translateX(0); }
.panel-head { background: var(--olive); color: var(--white); padding: 10px 12px; display: flex; align-items: center; gap: 8px; }
.panel-head button { min-height: 44px; min-width: 44px; background: var(--rust); color: var(--white); border: none; border-radius: 4px; font-size: 20px; font-weight: 700; }
.panel-head h2 { margin: 0; flex: 1; font-size: 18px; }
.panel-body { overflow: auto; padding: 12px; flex: 1; }
.panel-body h3 { margin: 14px 0 6px; color: var(--olive); border-bottom: 1px solid #ddd; padding-bottom: 4px; }
.panel-body table { width: 100%; border-collapse: collapse; font-size: 14px; }
.panel-body td { padding: 6px 4px; border-bottom: 1px solid #eee; vertical-align: top; }
.panel-body a { color: var(--charcoal); text-decoration: none; }
.panel-body a:hover, .panel-body a:focus { text-decoration: underline; color: var(--olive); }
.pending { color: #888; font-style: italic; }
.pending-tag { font-size: 11px; color: var(--terracotta); margin-left: 6px; }
.qty { font-weight: 700; color: var(--olive); width: 36px; }
.size { color: #666; font-size: 12px; white-space: nowrap; }
.note { font-size: 12px; color: #666; margin-top: 12px; }
.search-view { display: none; padding: 14px; max-width: 720px; margin: 0 auto; }
.search-view input, .search-view select { width: 100%; min-height: 44px; margin-bottom: 8px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
.footer { padding: 8px 14px; font-size: 12px; color: #666; background: #fff; border-top: 1px solid #ddd; }
#app { display: none; }
#gate {
  position: fixed; inset: 0; background: #f4f1ec; display: flex; align-items: center; justify-content: center; z-index: 100;
}
.gate-box {
  background: #fff; padding: 28px 24px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  width: 100%; max-width: 340px; text-align: center;
}
.gate-box h1 { margin: 0 0 6px; font-size: 22px; color: var(--olive); }
.gate-box p { margin: 0 0 18px; font-size: 14px; color: #666; }
.gate-box input {
  width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid #ccc; border-radius: 4px;
  font-size: 18px; text-align: center; letter-spacing: 0.08em; margin-bottom: 12px;
}
.gate-box button {
  width: 100%; min-height: 48px; background: var(--olive); color: var(--white); border: none;
  border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer;
}
.gate-box .msg { margin-top: 12px; font-size: 13px; color: var(--rust); min-height: 18px; }
.logout { background: none; border: none; color: var(--white); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; }
@media (max-width: 768px) {
  .panel { width: 100%; height: 70%; top: auto; bottom: 0; right: 0; transform: translateY(100%); }
  .panel.open { transform: translateY(0); }
  .stage { max-width: 100%; }
}
@media (max-width: 480px) and (orientation: portrait) {
  .btn { font-size: 7px; padding: 1px 4px; min-height: 16px; min-width: 16px; border-radius: 5px; }
}
.pub-date { display: block; font-size: 11px; color: #666; margin-top: 2px; }
.panel-body a:hover + .pub-date, .panel-body a:focus + .pub-date { color: var(--olive); }
</style>
</head>
<body>
<div id="gate">
  <div class="gate-box">
    <h1>Project Delta</h1>
    <p>Enter passcode</p>
    <form id="gateForm" onsubmit="return checkCode(event)">
      <input id="code" type="password" inputmode="text" autocomplete="off" aria-label="Passcode" required>
      <button type="submit">Enter</button>
    </form>
    <div class="msg" id="gateMsg"></div>
  </div>
</div>
<div id="app">
<header>
  <span>Project Delta</span>
  <span class="role"><span id="roleLabel"></span> <button class="logout" onclick="logout()">Log out</button></span>
</header>
<div class="nav">
  <button id="mapBtn" class="active" onclick="showMap()">Map</button>
  <button id="searchBtn" onclick="showSearch()">Search</button>
</div>
<div class="counts" id="countsStrip">Loading counts…</div>
<div class="layout" id="mapView">
  <div class="stage">
    <img id="mapImg" src="map.png" alt="Garden map">
    <button class="btn" style="left:49.0%; top:36.5%;" data-garden="Walled Garden">WALLED</button>
    <button class="btn" style="left:52.0%; top:8.0%;" data-garden="Piedmont">PIEDMONT</button>
    <button class="btn" style="left:5.5%; top:30.5%;" data-garden="Shuttle Path">SHUTTLE</button>
    <button class="btn" style="left:20.0%; top:25.5%;" data-garden="Orangerie">ORANGERIE</button>
    <button class="btn" style="left:35.0%; top:32.0%;" data-garden="Fountain Garden">FOUNTAIN</button>
    <button class="btn" style="left:45.0%; top:20.0%;" data-garden="Overlook">OVERLOOK</button>
    <button class="btn" style="left:68.0%; top:20.0%;" data-garden="Rockery">ROCKERY</button>
    <button class="btn" style="left:66.0%; top:39.5%;" data-garden="Water Terrace">WATER TERRACES</button>
    <button class="btn" style="left:27.0%; top:50.0%;" data-garden="Mirror Garden">MIRROR</button>
    <button class="btn" style="left:56.0%; top:58.0%;" data-garden="Wonderland">WONDERLAND</button>
    <button class="btn" style="left:15.0%; top:75.0%;" data-garden="Passage">PASSAGE</button>
    <button class="btn" style="left:46.5%; top:70.0%;" data-garden="Maintenance">MAINTENANCE</button>
    <button class="btn" style="left:86.5%; top:35.0%;" data-garden="Beltline">BELTLINE</button>
    <button class="btn" style="left:76.0%; top:55.0%;" data-garden="Visitor Center">VISITOR CENTER</button>
    <button class="btn inactive" style="left:80.5%; top:85.0%;" title="Access Drive — reserved">ACCESS DRIVE</button>
  </div>
</div>
<div class="search-view" id="searchView">
  <label for="q">Search plant name</label>
  <input id="q" type="search" placeholder="Botanical, cultivar, or common name" aria-label="Search plant name">
  <label for="gardenFilter">Garden</label>
  <select id="gardenFilter" aria-label="Filter by garden"><option value="">All gardens</option></select>
  <label for="typeFilter">Type</label>
  <select id="typeFilter" aria-label="Filter by type"><option value="">All types</option></select>
  <button type="button" onclick="printSearch()" style="min-height:44px;margin-bottom:12px;padding:8px 16px;background:var(--olive);color:#fff;border:none;border-radius:4px;font-weight:600;">Print search results</button>
  <div id="searchResults"></div>
</div>
<aside class="panel" id="panel" aria-label="Garden plant list">
  <div class="panel-head">
    <button type="button" aria-label="Previous garden" onclick="pageGarden(-1)">‹</button>
    <h2 id="title">Garden</h2>
    <button type="button" aria-label="Next garden" onclick="pageGarden(1)">›</button>
    <select id="printSelect" aria-label="Print options" onchange="handlePrint(this.value)" style="margin-left:8px;min-height:40px;font-size:14px;background:#fff;color:#1F2A2F;border-radius:4px;">
      <option value="">Print…</option>
      <option value="all">Whole garden</option>
      <option value="Trees">Trees only</option>
      <option value="Shrubs">Shrubs only</option>
      <option value="Groundcovers/Perennials">Groundcovers/Perennials</option>
      <option value="Ground Covers/Perennials/Annuals">Ground Covers/Perennials/Annuals</option>
      <option value="Groundcovers/Ornamental Grasses/Bamboo/Perennials">Groundcovers/Ornamental Grasses/Bamboo/Perennials</option>
      <option value="Woody Groundcovers/Vines">Woody Groundcovers/Vines</option>
      <option value="Bulbs">Bulbs only</option>
      <option value="Love Grass">Love Grass</option>
      <option value="Green Roof Planting">Green Roof Planting</option>
    </select>
  </div>
  <div class="panel-body" id="content"></div>
</aside>
<footer class="footer" id="versionFooter">Loading data…</footer>
</div>
<script>
const CODES = { '2029': 'user', '1125': 'admin' };
const AUTH_KEY = 'pd_auth';

function checkCode(e) {
  e.preventDefault();
  const code = document.getElementById('code').value.trim().toLowerCase();
  const role = CODES[code];
  if (!role) {
    document.getElementById('gateMsg').textContent = 'Incorrect passcode.';
    document.getElementById('code').value = '';
    return false;
  }
  sessionStorage.setItem(AUTH_KEY, role);
  openApp(role);
  return false;
}

function openApp(role) {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('roleLabel').textContent = role === 'admin' ? 'Admin' : 'Field';
  if (!DATA) load().catch(err => {
    document.getElementById('versionFooter').textContent = 'Data file not loaded. Place plant-data.json next to this page.';
    console.error(err);
  });
}

function logout() {
  sessionStorage.removeItem(AUTH_KEY);
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('code').value = '';
  document.getElementById('gateMsg').textContent = '';
  document.getElementById('panel').classList.remove('open');
}

const DATA_VERSION = '2026-10-17-zero-v2';
const DATA_FILE = 'plant-data.json?v=' + DATA_VERSION;
const STATUS_FILE = 'pdf-status.json?v=' + DATA_VERSION;
const gardenOrder = ["Piedmont","Shuttle Path","Orangerie","Fountain Garden","Overlook","Walled Garden","Rockery","Water Terrace","Mirror Garden","Wonderland","Passage","Maintenance","Beltline","Visitor Center"];
let DATA = null;
let PRESENT = new Set();
let currentGarden = null;

(function initAuth() {
  const role = sessionStorage.getItem(AUTH_KEY);
  if (role === 'user' || role === 'admin') openApp(role);
})();

function pdfHref(id) { return '05_PDFs/' + id + '.pdf'; }
function hasSheet(id) { return PRESENT.has(id + '.pdf') || PRESENT.has(id); }

function nameCell(id, plant) {
  const name = plant.display || plant.name || id;
  if (hasSheet(id)) {
    const pub = plant.published ? `<span class="pub-date">${plant.published}</span>` : '';
    return `<a href="${pdfHref(id)}">${name}</a>${pub}`;
  }
  return `<span class="pending">${name}</span><span class="pending-tag">sheet pending</span>`;
}

async function load() {
  const res = await fetch(DATA_FILE);
  DATA = await res.json();
  try {
    const s = await fetch(STATUS_FILE);
    const status = await s.json();
    PRESENT = new Set(status.present || []);
  } catch (e) {
    PRESENT = new Set();
  }
  const ver = DATA.version || DATA_VERSION;
  const pdfCount = PRESENT.size;
  document.getElementById('versionFooter').textContent = 'Data: ' + ver + ' | PDFs present: ' + pdfCount + ' | Missing sheets show “sheet pending” | Full botanical and common names | Published date on each sheet';
  renderCounts();
  const gf = document.getElementById('gardenFilter');
  gardenOrder.forEach(g => { const o = document.createElement('option'); o.value = g; o.textContent = g; gf.appendChild(o); });
  const types = [...new Set(Object.values(DATA.plants).map(p => p.type))].sort();
  const tf = document.getElementById('typeFilter');
  types.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; tf.appendChild(o); });
}

function renderCounts() {
  if (!DATA || !DATA.plants) return;
  const counts = {};
  Object.values(DATA.plants).forEach(p => {
    const t = p.type || 'Other';
    counts[t] = (counts[t] || 0) + 1;
  });
  const order = ['Tree', 'Shrub', 'Groundcover', 'Bulb', 'Vine', 'Green Roof'];
  const parts = order.filter(t => counts[t]).map(t => `<span><strong>${counts[t]}</strong> ${t}${counts[t] === 1 ? '' : 's'}</span>`);
  const total = Object.values(counts).reduce((s, n) => s + n, 0);
  document.getElementById('countsStrip').innerHTML = parts.join('') + `<span style="margin-left:auto;"><strong>${total}</strong> unique plants</span>`;
}

function openPanel(garden) {
  currentGarden = garden;
  document.getElementById('title').textContent = garden;
  document.getElementById('panel').classList.add('open');
  document.querySelectorAll('.btn').forEach(b => b.classList.toggle('active', b.dataset.garden === garden));
  const content = document.getElementById('content');
  const g = DATA && DATA.gardens && DATA.gardens[garden];
  if (!g) { content.innerHTML = '<p>No plant list for this garden in the data file.</p>'; return; }
  let html = '';
  for (const [section, rows] of Object.entries(g)) {
    const merged = {};
    rows.forEach(r => {
      const id = r.id;
      if (!merged[id]) merged[id] = { qty: 0, sizes: [] };
      merged[id].qty += (parseInt(r.qty, 10) || 0);
      if (r.size && !merged[id].sizes.includes(r.size)) merged[id].sizes.push(r.size);
    });
    const total = Object.values(merged).reduce((s, m) => s + m.qty, 0);
    html += `<h3>${section} <span style="font-weight:400;color:#666;">(${total})</span></h3><table>`;
    const sorted = Object.entries(merged).sort((a, b) => {
      const pa = DATA.plants[a[0]] || {};
      const pb = DATA.plants[b[0]] || {};
      const na = (pa.display || pa.name || a[0]).toLowerCase();
      const nb = (pb.display || pb.name || b[0]).toLowerCase();
      return na.localeCompare(nb);
    });
    for (const [id, m] of sorted) {
      const plant = DATA.plants[id] || {};
      const sizeStr = m.sizes.join(', ');
      html += `<tr><td class="qty">${m.qty}</td><td>${nameCell(id, plant)}</td><td class="size">${sizeStr}</td></tr>`;
    }
    html += '</table>';
  }
  html += '<p class="note">Click a plant name to open its ID sheet. Full botanical and common names, including cultivar and variety. Sheets not yet dropped show “sheet pending.”</p>';
  content.innerHTML = html;
}

function pageGarden(dir) {
  let idx = gardenOrder.indexOf(currentGarden);
  if (idx < 0) idx = 0;
  idx = (idx + dir + gardenOrder.length) % gardenOrder.length;
  openPanel(gardenOrder[idx]);
}

function closePanel() { document.getElementById('panel').classList.remove('open'); }

function showMap() {
  document.getElementById('mapView').style.display = 'block';
  document.getElementById('searchView').style.display = 'none';
  document.getElementById('countsStrip').style.display = 'flex';
  document.getElementById('mapBtn').classList.add('active');
  document.getElementById('searchBtn').classList.remove('active');
}
function showSearch() {
  document.getElementById('mapView').style.display = 'none';
  document.getElementById('searchView').style.display = 'block';
  document.getElementById('countsStrip').style.display = 'none';
  document.getElementById('mapBtn').classList.remove('active');
  document.getElementById('searchBtn').classList.add('active');
  closePanel();
  runSearch();
}

function runSearch() {
  if (!DATA) return;
  const q = document.getElementById('q').value.trim().toLowerCase();
  const g = document.getElementById('gardenFilter').value;
  const t = document.getElementById('typeFilter').value;
  const box = document.getElementById('searchResults');
  const hits = [];
  for (const p of Object.values(DATA.plants)) {
    if (t && p.type !== t) continue;
    const name = (p.display || p.name || '').toLowerCase();
    if (q && !name.includes(q)) continue;
    const gardens = Object.keys(p.gardens || {});
    if (g && !gardens.includes(g)) continue;
    hits.push(p);
  }
  if (!hits.length) { box.innerHTML = '<p>No matches.</p>'; return; }
  hits.sort((a, b) => (a.display || a.name || '').toLowerCase().localeCompare((b.display || b.name || '').toLowerCase()));
  let html = '<table>';
  hits.slice(0, 80).forEach(p => {
    const gardens = Object.keys(p.gardens || {}).join(', ');
    html += `<tr><td>${nameCell(p.id, p)} <button type="button" onclick="printPlant('${p.id}')" aria-label="Print this plant" style="margin-left:6px;font-size:12px;padding:2px 6px;background:#9C5F4A;color:#fff;border:none;border-radius:3px;">Print</button></td><td class="size">${p.type}</td><td class="size">${gardens}</td></tr>`;
  });
  html += '</table>';
  if (hits.length > 80) html += '<p class="note">Showing first 80 of ' + hits.length + '.</p>';
  box.innerHTML = html;
}

document.querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => openPanel(b.dataset.garden)));
document.querySelector('.stage').addEventListener('click', (e) => {
  if (e.target.closest('.btn')) return;
  if (document.getElementById('panel').classList.contains('open')) closePanel();
});
document.getElementById('q').addEventListener('input', runSearch);
document.getElementById('gardenFilter').addEventListener('change', runSearch);
document.getElementById('typeFilter').addEventListener('change', runSearch);

function printPlant(id) {
  if (!DATA || !DATA.plants[id]) return;
  const p = DATA.plants[id];
  const name = p.display || p.name || id;
  let body = `<h1>${name}</h1>`;
  if (p.botanical) body += `<p><strong>Botanical:</strong> ${p.botanical}</p>`;
  if (p.common) body += `<p><strong>Common:</strong> ${p.common}</p>`;
  if (p.cultivar) body += `<p><strong>Cultivar:</strong> ${p.cultivar}</p>`;
  body += `<p><strong>Type:</strong> ${p.type || ''}</p>`;
  body += `<h2>Gardens</h2><table><thead><tr><th>Garden</th><th>Qty</th><th>Size</th></tr></thead><tbody>`;
  const gardens = p.gardens || {};
  const sorted = Object.keys(gardens).sort();
  for (const g of sorted) {
    const rows = gardens[g] || [];
    rows.forEach(r => {
      body += `<tr><td>${g}</td><td>${r.qty || ''}</td><td>${r.size || ''}</td></tr>`;
    });
  }
  body += '</tbody></table>';
  openPrintView(name, body);
}

function handlePrint(value) {
  if (!value) return;
  document.getElementById('printSelect').value = '';
  if (value === 'all') printGarden();
  else printGarden(value);
}

function printGarden(onlySection) {
  if (!currentGarden || !DATA) return;
  const g = DATA.gardens && DATA.gardens[currentGarden];
  if (!g) return;
  let body = `<h1>${currentGarden}${onlySection ? ' — ' + onlySection : ''}</h1>`;
  const sections = onlySection ? [[onlySection, g[onlySection] || []]] : Object.entries(g);
  for (const [section, rows] of sections) {
    if (!rows || !rows.length) continue;
    const merged = {};
    rows.forEach(r => {
      const id = r.id;
      if (!merged[id]) merged[id] = { qty: 0, sizes: [] };
      merged[id].qty += (parseInt(r.qty, 10) || 0);
      if (r.size && !merged[id].sizes.includes(r.size)) merged[id].sizes.push(r.size);
    });
    body += `<h2>${section}</h2><table><thead><tr><th>Qty</th><th>Plant</th><th>Size</th></tr></thead><tbody>`;
    const sorted = Object.entries(merged).sort((a, b) => {
      const pa = DATA.plants[a[0]] || {};
      const pb = DATA.plants[b[0]] || {};
      return ((pa.display || pa.name || a[0]).toLowerCase()).localeCompare((pb.display || pb.name || b[0]).toLowerCase());
    });
    for (const [id, m] of sorted) {
      const plant = DATA.plants[id] || {};
      const name = plant.display || plant.name || id;
      const sizeStr = m.sizes.join(', ');
      body += `<tr><td>${m.qty}</td><td>${name}</td><td>${sizeStr}</td></tr>`;
    }
    body += '</tbody></table>';
  }
  openPrintView(currentGarden + (onlySection ? ' — ' + onlySection : ''), body);
}

function printSearch() {
  if (!DATA) return;
  const q = document.getElementById('q').value.trim();
  const g = document.getElementById('gardenFilter').value;
  const t = document.getElementById('typeFilter').value;
  const hits = [];
  for (const p of Object.values(DATA.plants)) {
    if (t && p.type !== t) continue;
    const name = (p.display || p.name || '').toLowerCase();
    if (q && !name.includes(q.toLowerCase())) continue;
    const gardens = Object.keys(p.gardens || {});
    if (g && !gardens.includes(g)) continue;
    hits.push(p);
  }
  hits.sort((a, b) => (a.display || a.name || '').toLowerCase().localeCompare((b.display || b.name || '').toLowerCase()));
  let body = `<h1>Search results</h1>`;
  if (q) body += `<p>Search: ${q}</p>`;
  if (g) body += `<p>Garden: ${g}</p>`;
  if (t) body += `<p>Type: ${t}</p>`;
  body += '<table><thead><tr><th>Plant</th><th>Type</th><th>Gardens</th></tr></thead><tbody>';
  hits.forEach(p => {
    const name = p.display || p.name || p.id;
    const gardens = Object.keys(p.gardens || {}).join(', ');
    body += `<tr><td>${name}</td><td>${p.type || ''}</td><td>${gardens}</td></tr>`;
  });
  body += '</tbody></table>';
  openPrintView('Search results', body);
}

function openPrintView(title, body) {
  const w = window.open('', '_blank');
  if (!w) { alert('Allow pop-ups to print'); return; }
  w.document.write(`<!DOCTYPE html><html><head><title>${title}</title><style>
    body{font-family:sans-serif;margin:20px;}
    h1{color:#3A5F3A;}
    table{border-collapse:collapse;width:100%;margin-bottom:20px;}
    th,td{border:1px solid #ccc;padding:6px;text-align:left;}
    th{background:#3A5F3A;color:#fff;}
    .close-bar{position:fixed;top:0;left:0;right:0;background:#3A5F3A;color:#fff;padding:10px;text-align:center;z-index:10;}
    .close-bar button{background:#9C5F4A;color:#fff;border:none;padding:8px 16px;border-radius:4px;font-weight:600;min-height:40px;}
    body{padding-top:50px;}
  </style></head><body>
  <div class="close-bar"><button onclick="window.close()">Close and return</button> <button onclick="window.print()">Print</button></div>
  ${body}
  </body></html>`);
  w.document.close();
  w.focus();
}

</script>
</body>
</html>
